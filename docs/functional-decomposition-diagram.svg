<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
  <title id="title">Functional Decomposition Diagram of KaanoonGPT</title>
  <desc id="desc">Functional Decomposition Diagram showing KaanoonGPT decomposed into RAG, courtroom simulator, petition maker, authentication, and admin knowledge base systems with their major functions.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .root { fill: #1f7fc1; stroke: #17659b; stroke-width: 2; }
      .module { fill: #d9d9d9; stroke: #38aee2; stroke-width: 4; }
      .func { fill: #d9d9d9; stroke: #38aee2; stroke-width: 4; }
      .root-text { font: 700 25px Arial, sans-serif; fill: #ffffff; }
      .module-text { font: 700 13px Arial, sans-serif; fill: #111827; }
      .func-text { font: 700 13px Arial, sans-serif; fill: #111827; }
      .arrow { stroke: #111827; stroke-width: 2.4; fill: none; marker-end: url(#arrowhead); }
      .line { stroke: #111827; stroke-width: 2.4; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#111827" />
    </marker>
  </defs>

  <rect class="bg" width="1500" height="950" />

  <!-- Root -->
  <rect class="root" x="525" y="35" width="450" height="85" rx="8" />
  <text class="root-text" x="750" y="70" text-anchor="middle">KaanoonGPT</text>
  <text class="root-text" x="750" y="100" text-anchor="middle">AI-Powered Legal Platform</text>

  <!-- Connector spine -->
  <path class="line" d="M750 120 V165" />
  <path class="line" d="M140 165 H1360" />

  <!-- Module boxes -->
  <rect class="module" x="55" y="220" width="210" height="86" rx="4" />
  <text class="module-text" x="160" y="250" text-anchor="middle">Retrieval-Augmented</text>
  <text class="module-text" x="160" y="268" text-anchor="middle">Generation (RAG)</text>
  <text class="module-text" x="160" y="286" text-anchor="middle">System</text>

  <rect class="module" x="340" y="220" width="230" height="86" rx="4" />
  <text class="module-text" x="455" y="250" text-anchor="middle">Agentic Courtroom</text>
  <text class="module-text" x="455" y="268" text-anchor="middle">Simulator System</text>
  <text class="module-text" x="455" y="286" text-anchor="middle">(ACSS)</text>

  <rect class="module" x="640" y="220" width="220" height="86" rx="4" />
  <text class="module-text" x="750" y="250" text-anchor="middle">Firad Patra /</text>
  <text class="module-text" x="750" y="268" text-anchor="middle">Petition Maker</text>
  <text class="module-text" x="750" y="286" text-anchor="middle">System</text>

  <rect class="module" x="930" y="220" width="220" height="86" rx="4" />
  <text class="module-text" x="1040" y="250" text-anchor="middle">Authentication and</text>
  <text class="module-text" x="1040" y="268" text-anchor="middle">User Management</text>
  <text class="module-text" x="1040" y="286" text-anchor="middle">System (AUMS)</text>

  <rect class="module" x="1220" y="220" width="230" height="86" rx="4" />
  <text class="module-text" x="1335" y="250" text-anchor="middle">Admin and Knowledge</text>
  <text class="module-text" x="1335" y="268" text-anchor="middle">Base Management</text>
  <text class="module-text" x="1335" y="286" text-anchor="middle">System</text>

  <!-- Arrows to module boxes -->
  <path class="arrow" d="M140 165 V210" />
  <path class="arrow" d="M455 165 V210" />
  <path class="arrow" d="M750 165 V210" />
  <path class="arrow" d="M1040 165 V210" />
  <path class="arrow" d="M1360 165 V210" />

  <!-- Function panels -->
  <rect class="func" x="35" y="410" width="250" height="420" rx="4" />
  <text class="func-text" x="70" y="465">1. Query Processing</text>
  <text class="func-text" x="70" y="525">2. Embedding Generation</text>
  <text class="func-text" x="70" y="585">3. Semantic Retrieval</text>
  <text class="func-text" x="70" y="645">4. Context Assembly</text>
  <text class="func-text" x="70" y="705">5. Response Generation</text>
  <text class="func-text" x="70" y="765">6. Citation Display</text>

  <rect class="func" x="330" y="410" width="250" height="420" rx="4" />
  <text class="func-text" x="365" y="455">1. Case Document Upload</text>
  <text class="func-text" x="365" y="510">2. Document Extraction</text>
  <text class="func-text" x="365" y="565">3. Plaintiff Agent</text>
  <text class="func-text" x="365" y="620">4. Defendant Agent</text>
  <text class="func-text" x="365" y="675">5. Judge Agent</text>
  <text class="func-text" x="365" y="730">6. Verdict Generation</text>
  <text class="func-text" x="365" y="785">7. Transcript History</text>

  <rect class="func" x="625" y="410" width="250" height="420" rx="4" />
  <text class="func-text" x="660" y="465">1. User Detail Collection</text>
  <text class="func-text" x="660" y="525">2. Case Fact Collection</text>
  <text class="func-text" x="660" y="585">3. Petition Drafting</text>
  <text class="func-text" x="660" y="645">4. Review and Editing</text>
  <text class="func-text" x="660" y="705">5. Export Petition</text>
  <text class="func-text" x="660" y="765">6. Save Draft</text>

  <rect class="func" x="920" y="410" width="250" height="420" rx="4" />
  <text class="func-text" x="955" y="465">1. User Registration</text>
  <text class="func-text" x="955" y="525">2. Login Authentication</text>
  <text class="func-text" x="955" y="585">3. OTP Verification</text>
  <text class="func-text" x="955" y="645">4. JWT Token Handling</text>
  <text class="func-text" x="955" y="705">5. Profile Management</text>
  <text class="func-text" x="955" y="765">6. Access Control</text>

  <rect class="func" x="1215" y="410" width="250" height="420" rx="4" />
  <text class="func-text" x="1250" y="455">1. Law Management</text>
  <text class="func-text" x="1250" y="510">2. Case Management</text>
  <text class="func-text" x="1250" y="565">3. KB Ingestion</text>
  <text class="func-text" x="1250" y="620">4. Law Catalog</text>
  <text class="func-text" x="1250" y="675">5. Model Configuration</text>
  <text class="func-text" x="1250" y="730">6. Feature Management</text>
  <text class="func-text" x="1250" y="785">7. System Setup</text>

  <!-- Arrows from modules to panels -->
  <path class="arrow" d="M160 306 V395" />
  <path class="arrow" d="M455 306 V395" />
  <path class="arrow" d="M750 306 V395" />
  <path class="arrow" d="M1040 306 V395" />
  <path class="arrow" d="M1335 306 V395" />
</svg>
