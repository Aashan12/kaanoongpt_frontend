<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Class Diagram of Admin and Knowledge Management System</title>
  <desc id="desc">Class diagram showing admin routers, law and case models, catalog item, document processor, Chroma service, cloudinary service, embedding model, and system setup entities.</desc>
  <defs><style>
    .bg{fill:#fff}.title{font:700 26px Arial,sans-serif;fill:#111827}.class{fill:#fff;stroke:#1d4ed8;stroke-width:2}.model{fill:#f8fbff;stroke:#2563eb;stroke-width:2}.service{fill:#fdf2f8;stroke:#be185d;stroke-width:2}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2}
    .head{font:700 16px Arial,sans-serif;fill:#111827}.txt{font:600 13px Arial,sans-serif;fill:#374151}.line{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#a)}
  </style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker></defs>
  <rect class="bg" width="1500" height="1000"/><text class="title" x="750" y="45" text-anchor="middle">Class Diagram: Admin and Knowledge Management System</text>
  <g><rect class="class" x="55" y="95" width="250" height="190" rx="4"/><text class="head" x="180" y="122" text-anchor="middle">AdminKnowledgeRouter</text><line x1="55" y1="135" x2="305" y2="135" stroke="#1d4ed8"/><text class="txt" x="73" y="160">+ upload_law()</text><text class="txt" x="73" y="182">+ upload_case()</text><text class="txt" x="73" y="204">+ list_laws()</text><text class="txt" x="73" y="226">+ list_cases()</text><text class="txt" x="73" y="248">+ get_kb_stats()</text></g>
  <g><rect class="class" x="360" y="95" width="250" height="190" rx="4"/><text class="head" x="485" y="122" text-anchor="middle">LawCatalogRouter</text><line x1="360" y1="135" x2="610" y2="135" stroke="#1d4ed8"/><text class="txt" x="378" y="160">+ list_catalog()</text><text class="txt" x="378" y="182">+ ingest_catalog_item()</text><text class="txt" x="378" y="204">+ remove_catalog_data()</text><text class="txt" x="378" y="226">+ get_item_status()</text><text class="txt" x="378" y="248">+ seed_catalog()</text></g>
  <g><rect class="service" x="665" y="95" width="250" height="190" rx="4"/><text class="head" x="790" y="122" text-anchor="middle">AdminAuthService</text><line x1="665" y1="135" x2="915" y2="135" stroke="#be185d"/><text class="txt" x="683" y="160">+ get_current_admin_user()</text><text class="txt" x="683" y="182">+ validate_admin_token()</text><text class="txt" x="683" y="204">+ enforce_access_control()</text></g>
  <g><rect class="model" x="970" y="95" width="250" height="220" rx="4"/><text class="head" x="1095" y="122" text-anchor="middle">Law</text><line x1="970" y1="135" x2="1220" y2="135" stroke="#2563eb"/><text class="txt" x="988" y="160">+ title, law_number</text><text class="txt" x="988" y="182">+ category</text><text class="txt" x="988" y="204">+ country_code, state</text><text class="txt" x="988" y="226">+ file_url, public_id</text><text class="txt" x="988" y="248">+ embedding_status</text><text class="txt" x="988" y="270">+ chunk_count, error_log</text></g>
  <g><rect class="model" x="55" y="380" width="250" height="220" rx="4"/><text class="head" x="180" y="407" text-anchor="middle">Case</text><line x1="55" y1="420" x2="305" y2="420" stroke="#2563eb"/><text class="txt" x="73" y="445">+ case_title, citation</text><text class="txt" x="73" y="467">+ court_name</text><text class="txt" x="73" y="489">+ precedent_level</text><text class="txt" x="73" y="511">+ country_code</text><text class="txt" x="73" y="533">+ file_url, public_id</text><text class="txt" x="73" y="555">+ embedding_status</text><text class="txt" x="73" y="577">+ fact_summary, holding</text></g>
  <g><rect class="model" x="360" y="380" width="250" height="220" rx="4"/><text class="head" x="485" y="407" text-anchor="middle">LawCatalogItem</text><line x1="360" y1="420" x2="610" y2="420" stroke="#2563eb"/><text class="txt" x="378" y="445">+ title, description</text><text class="txt" x="378" y="467">+ source_url</text><text class="txt" x="378" y="489">+ source_type</text><text class="txt" x="378" y="511">+ category, country_code</text><text class="txt" x="378" y="533">+ status</text><text class="txt" x="378" y="555">+ section_count</text><text class="txt" x="378" y="577">+ chunk_count</text></g>
  <g><rect class="service" x="665" y="380" width="250" height="220" rx="4"/><text class="head" x="790" y="407" text-anchor="middle">DocumentProcessor</text><line x1="665" y1="420" x2="915" y2="420" stroke="#be185d"/><text class="txt" x="683" y="445">+ extract_text_with_pages()</text><text class="txt" x="683" y="467">+ chunk_text_with_pages()</text><text class="txt" x="683" y="489">+ chunk_text()</text><text class="txt" x="683" y="511">+ detect_category()</text></g>
  <g><rect class="service" x="970" y="380" width="250" height="220" rx="4"/><text class="head" x="1095" y="407" text-anchor="middle">ChromaService</text><line x1="970" y1="420" x2="1220" y2="420" stroke="#be185d"/><text class="txt" x="988" y="445">+ get_collection_name()</text><text class="txt" x="988" y="467">+ get_or_create_collection()</text><text class="txt" x="988" y="489">+ add_documents()</text><text class="txt" x="988" y="511">+ search_documents()</text><text class="txt" x="988" y="533">+ delete_collection()</text></g>
  <g><rect class="service" x="55" y="700" width="250" height="160" rx="4"/><text class="head" x="180" y="727" text-anchor="middle">CloudinaryService</text><line x1="55" y1="740" x2="305" y2="740" stroke="#be185d"/><text class="txt" x="73" y="765">+ upload_document()</text><text class="txt" x="73" y="787">+ delete_document()</text></g>
  <g><rect class="db" x="360" y="700" width="250" height="160" rx="4"/><text class="head" x="485" y="727" text-anchor="middle">LLMModel</text><line x1="360" y1="740" x2="610" y2="740" stroke="#059669"/><text class="txt" x="378" y="765">+ model_type</text><text class="txt" x="378" y="787">+ provider</text><text class="txt" x="378" y="809">+ model_name</text><text class="txt" x="378" y="831">+ status</text></g>
  <g><rect class="db" x="665" y="700" width="250" height="160" rx="4"/><text class="head" x="790" y="727" text-anchor="middle">SystemSetupModels</text><line x1="665" y1="740" x2="915" y2="740" stroke="#059669"/><text class="txt" x="683" y="765">+ Country, State, City</text><text class="txt" x="683" y="787">+ CourtType</text><text class="txt" x="683" y="809">+ CaseType</text><text class="txt" x="683" y="831">+ LawCategory</text></g>
  <g><rect class="db" x="970" y="700" width="250" height="160" rx="4"/><text class="head" x="1095" y="727" text-anchor="middle">VectorCollection</text><line x1="970" y1="740" x2="1220" y2="740" stroke="#059669"/><text class="txt" x="988" y="765">+ collection_name</text><text class="txt" x="988" y="787">+ chunk_id</text><text class="txt" x="988" y="809">+ content</text><text class="txt" x="988" y="831">+ metadata</text></g>
  <path class="line" d="M305 190 H360"/><path class="line" d="M610 190 H665"/><path class="line" d="M305 490 H360"/><path class="line" d="M610 490 H665"/><path class="line" d="M915 490 H970"/><path class="line" d="M1095 315 V380"/><path class="line" d="M180 600 V700"/><path class="line" d="M790 600 V700"/><path class="line" d="M1095 600 V700"/><path class="line" d="M610 780 H665"/>
</svg>
