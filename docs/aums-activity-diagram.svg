<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc">
  <title id="title">Activity Diagram of Authentication and User Management System</title>
  <desc id="desc">Activity diagram showing registration, OTP verification, login, JWT validation, protected access, and logout in AUMS.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.node{fill:#fff;stroke:#1f2937;stroke-width:2.2}.decision{fill:#fff;stroke:#1f2937;stroke-width:2.2}.start{fill:#111827;stroke:#111827}
      .label{font:600 18px Arial,sans-serif;fill:#111827}.small{font:600 14px Arial,sans-serif;fill:#374151}.arrow{stroke:#111827;stroke-width:2.4;fill:none;marker-end:url(#a)}
      .note{fill:#eef6ff;stroke:#38aee2;stroke-width:1.8}.note-text{font:600 13px Arial,sans-serif;fill:#1e3a8a}
    </style>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker>
  </defs>
  <rect class="bg" width="1200" height="1450"/>
  <circle class="start" cx="600" cy="50" r="18"/><path class="arrow" d="M600 68 V100"/>
  <rect class="node" x="405" y="100" width="390" height="58" rx="4"/><text class="label" x="600" y="136" text-anchor="middle">Open Authentication Page</text><path class="arrow" d="M600 158 V200"/>
  <path class="decision" d="M600 200 L735 280 L600 360 L465 280 Z"/><text class="label" x="600" y="275" text-anchor="middle">User Has</text><text class="label" x="600" y="300" text-anchor="middle">Account?</text>
  <path class="arrow" d="M465 280 H220 V420"/><text class="small" x="310" y="260">No</text>
  <path class="arrow" d="M735 280 H980 V420"/><text class="small" x="870" y="260">Yes</text>

  <rect class="node" x="80" y="420" width="280" height="58" rx="4"/><text class="label" x="220" y="456" text-anchor="middle">Submit Signup Details</text><path class="arrow" d="M220 478 V520"/>
  <rect class="node" x="80" y="520" width="280" height="70" rx="4"/><text class="label" x="220" y="549" text-anchor="middle">Hash Password and</text><text class="label" x="220" y="574" text-anchor="middle">Create Pending User</text><path class="arrow" d="M220 590 V635"/>
  <rect class="node" x="80" y="635" width="280" height="58" rx="4"/><text class="label" x="220" y="671" text-anchor="middle">Send Email OTP</text><path class="arrow" d="M220 693 V735"/>
  <rect class="node" x="80" y="735" width="280" height="58" rx="4"/><text class="label" x="220" y="771" text-anchor="middle">User Enters OTP</text><path class="arrow" d="M220 793 V835"/>
  <path class="decision" d="M220 835 L340 905 L220 975 L100 905 Z"/><text class="label" x="220" y="900" text-anchor="middle">OTP Valid</text><text class="label" x="220" y="924" text-anchor="middle">and Active?</text>
  <path class="arrow" d="M100 905 H50 V735 H80"/><text class="small" x="52" y="890">No / Resend</text>
  <path class="arrow" d="M340 905 H470 V1015"/><text class="small" x="385" y="887">Yes</text>

  <rect class="node" x="840" y="420" width="280" height="58" rx="4"/><text class="label" x="980" y="456" text-anchor="middle">Submit Login Details</text><path class="arrow" d="M980 478 V520"/>
  <rect class="node" x="840" y="520" width="280" height="58" rx="4"/><text class="label" x="980" y="556" text-anchor="middle">Find User in MongoDB</text><path class="arrow" d="M980 578 V620"/>
  <rect class="node" x="840" y="620" width="280" height="70" rx="4"/><text class="label" x="980" y="649" text-anchor="middle">Verify Password, Email,</text><text class="label" x="980" y="674" text-anchor="middle">and Account Status</text><path class="arrow" d="M980 690 V735"/>
  <path class="decision" d="M980 735 L1100 805 L980 875 L860 805 Z"/><text class="label" x="980" y="800" text-anchor="middle">Credentials</text><text class="label" x="980" y="824" text-anchor="middle">Valid?</text>
  <path class="arrow" d="M1100 805 H1150 V420 H1120"/><text class="small" x="1115" y="790">No</text>
  <path class="arrow" d="M860 805 H730 V1015"/><text class="small" x="780" y="787">Yes</text>

  <rect class="node" x="470" y="1015" width="260" height="58" rx="4"/><text class="label" x="600" y="1051" text-anchor="middle">Create JWT Token</text><path class="arrow" d="M600 1073 V1115"/>
  <rect class="node" x="420" y="1115" width="360" height="58" rx="4"/><text class="label" x="600" y="1151" text-anchor="middle">Store Token in Frontend</text><path class="arrow" d="M600 1173 V1215"/>
  <rect class="node" x="360" y="1215" width="480" height="70" rx="4"/><text class="label" x="600" y="1244" text-anchor="middle">Access Protected Features</text><text class="label" x="600" y="1269" text-anchor="middle">with Bearer Token</text><path class="arrow" d="M600 1285 V1325"/>
  <rect class="node" x="405" y="1325" width="390" height="58" rx="4"/><text class="label" x="600" y="1361" text-anchor="middle">Logout and Clear Token</text><path class="arrow" d="M600 1383 V1410"/>
  <circle class="start" cx="600" cy="1428" r="18"/>
  <rect class="note" x="425" y="720" width="345" height="80" rx="6"/><text class="note-text" x="598" y="746" text-anchor="middle">Implemented flow uses email/password,</text><text class="note-text" x="598" y="766" text-anchor="middle">OTP verification, bcrypt hashing,</text><text class="note-text" x="598" y="786" text-anchor="middle">and JWT bearer authentication.</text>
</svg>
