  <ellipse class="uc" cx="430" cy="725" rx="140" ry="33"/><text class="label" x="430" y="731" text-anchor="middle">View Petition History</text>
  <ellipse class="uc" cx="430" cy="805" rx="140" ry="33"/><text class="label" x="430" y="811" text-anchor="middle">Delete Petition</text>
