  <ellipse class="uc" cx="430" cy="245" rx="130" ry="33"/><text class="label" x="430" y="251" text-anchor="middle">Select Case Type</text>
  <ellipse class="uc" cx="430" cy="325" rx="145" ry="33"/><text class="label" x="430" y="331" text-anchor="middle">Enter Petition Details</text>
  <ellipse class="uc" cx="430" cy="405" rx="145" ry="33"/><text class="label" x="430" y="411" text-anchor="middle">Review Live Draft</text>
  <ellipse class="uc" cx="430" cy="485" rx="140" ry="33"/><text class="label" x="430" y="491" text-anchor="middle">Edit Petition Draft</text>
  <ellipse class="uc" cx="430" cy="565" rx="140" ry="33"/><text class="label" x="430" y="571" text-anchor="middle">Generate PDF</text>
