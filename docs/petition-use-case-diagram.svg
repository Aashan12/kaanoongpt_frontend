  <rect class="boundary" x="250" y="80" width="980" height="850" rx="8"/><text class="atext" x="740" y="112" text-anchor="middle">Petition and Legal Document Generation System</text>
  <circle class="actor" cx="105" cy="205" r="23"/><path class="actor" d="M105 228 V300 M62 260 H148 M105 300 L65 360 M105 300 L145 360"/><text class="atext" x="105" y="395" text-anchor="middle">User</text>
  <rect class="ext" x="1290" y="145" width="160" height="64" rx="5"/><text class="atext" x="1370" y="172" text-anchor="middle">RAG /</text><text class="atext" x="1370" y="194" text-anchor="middle">ChromaDB</text>
  <rect class="ext" x="1290" y="355" width="160" height="64" rx="5"/><text class="atext" x="1370" y="382" text-anchor="middle">Language</text><text class="atext" x="1370" y="404" text-anchor="middle">Model</text>
  <rect class="ext" x="1290" y="565" width="160" height="64" rx="5"/><text class="atext" x="1370" y="592" text-anchor="middle">PDF</text><text class="atext" x="1370" y="614" text-anchor="middle">Generator</text>
  <rect class="ext" x="1290" y="775" width="160" height="64" rx="5"/><text class="atext" x="1370" y="802" text-anchor="middle">MongoDB /</text><text class="atext" x="1370" y="824" text-anchor="middle">Cloudinary</text>
