<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" viewBox="0 0 1500 950" role="img" aria-labelledby="title desc">
  <title id="title">Architecture of Petition and Legal Document Generation System</title>
  <desc id="desc">Layered architecture showing petition maker frontend, FastAPI backend, agentic generation, RAG retrieval, PDF export, storage, and monitoring.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.title{font:700 27px Arial,sans-serif;fill:#111827}.subtitle{font:600 15px Arial,sans-serif;fill:#475569}
      .layer{fill:#f8fbff;stroke:#2563eb;stroke-width:2.2}.box{fill:#fff;stroke:#1d4ed8;stroke-width:2;rx:6}
      .ai{fill:#fdf2f8;stroke:#be185d;stroke-width:2}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2}.warn{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}
      .label{font:700 16px Arial,sans-serif;fill:#111827}.small{font:600 13px Arial,sans-serif;fill:#374151}
      .arrow{stroke:#111827;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#6b7280;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrowg)}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker>
    <marker id="arrowg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/></marker>
  </defs>
  <rect class="bg" width="1500" height="950"/>
  <text class="title" x="750" y="45" text-anchor="middle">Architecture of Petition and Legal Document Generation System</text>
  <text class="subtitle" x="750" y="72" text-anchor="middle">Firad Patra generation through guided forms, AI-assisted drafting, RAG context, PDF export, and saved petition history</text>

  <rect class="layer" x="70" y="120" width="1360" height="120" rx="8"/>
  <text class="label" x="105" y="153">Frontend Layer</text>
  <rect class="box" x="250" y="145" width="190" height="62"/><text class="label" x="345" y="172" text-anchor="middle">Next.js UI</text><text class="small" x="345" y="193" text-anchor="middle">Petition Maker page</text>
  <rect class="box" x="485" y="145" width="190" height="62"/><text class="label" x="580" y="172" text-anchor="middle">React Forms</text><text class="small" x="580" y="193" text-anchor="middle">6-step data entry</text>
  <rect class="box" x="720" y="145" width="190" height="62"/><text class="label" x="815" y="172" text-anchor="middle">Live Preview</text><text class="small" x="815" y="193" text-anchor="middle">petition document</text>
  <rect class="box" x="955" y="145" width="190" height="62"/><text class="label" x="1050" y="172" text-anchor="middle">PDF Download</text><text class="small" x="1050" y="193" text-anchor="middle">firadpatra.pdf</text>

  <rect class="layer" x="70" y="290" width="1360" height="120" rx="8"/>
  <text class="label" x="105" y="323">Backend API Layer</text>
  <rect class="box" x="250" y="315" width="210" height="62"/><text class="label" x="355" y="342" text-anchor="middle">FastAPI Routes</text><text class="small" x="355" y="363" text-anchor="middle">/api/petition/agentic</text>
  <rect class="box" x="515" y="315" width="210" height="62"/><text class="label" x="620" y="342" text-anchor="middle">Petition Manager</text><text class="small" x="620" y="363" text-anchor="middle">save, list, get, delete</text>
  <rect class="box" x="780" y="315" width="210" height="62"/><text class="label" x="885" y="342" text-anchor="middle">Auth Guard</text><text class="small" x="885" y="363" text-anchor="middle">current user context</text>
  <rect class="box" x="1045" y="315" width="210" height="62"/><text class="label" x="1150" y="342" text-anchor="middle">PDF Generator</text><text class="small" x="1150" y="363" text-anchor="middle">ReportLab export</text>

  <rect class="layer" x="70" y="460" width="1360" height="145" rx="8"/>
  <text class="label" x="105" y="493">AI and RAG Layer</text>
  <rect class="ai" x="250" y="500" width="230" height="70" rx="6"/><text class="label" x="365" y="527" text-anchor="middle">Agentic Drafting Flow</text><text class="small" x="365" y="549" text-anchor="middle">questions, accept, regenerate</text>
  <rect class="ai" x="535" y="500" width="230" height="70" rx="6"/><text class="label" x="650" y="527" text-anchor="middle">Language Model</text><text class="small" x="650" y="549" text-anchor="middle">Nepali legal content</text>
  <rect class="db" x="820" y="500" width="230" height="70" rx="6"/><text class="label" x="935" y="527" text-anchor="middle">ChromaDB / Vector</text><text class="small" x="935" y="549" text-anchor="middle">civil law retrieval</text>
  <rect class="warn" x="1105" y="500" width="230" height="70" rx="6"/><text class="label" x="1220" y="527" text-anchor="middle">Legal Context</text><text class="small" x="1220" y="549" text-anchor="middle">citations and evidence hints</text>

  <rect class="layer" x="70" y="655" width="1360" height="120" rx="8"/>
  <text class="label" x="105" y="688">Storage and Export Layer</text>
  <rect class="db" x="250" y="680" width="220" height="62" rx="6"/><text class="label" x="360" y="707" text-anchor="middle">MongoDB</text><text class="small" x="360" y="728" text-anchor="middle">petition records</text>
  <rect class="db" x="535" y="680" width="220" height="62" rx="6"/><text class="label" x="645" y="707" text-anchor="middle">Cloudinary</text><text class="small" x="645" y="728" text-anchor="middle">saved PDF files</text>
  <rect class="box" x="820" y="680" width="220" height="62"/><text class="label" x="930" y="707" text-anchor="middle">User History</text><text class="small" x="930" y="728" text-anchor="middle">drafts and downloads</text>
  <rect class="box" x="1105" y="680" width="220" height="62"/><text class="label" x="1215" y="707" text-anchor="middle">Generated Output</text><text class="small" x="1215" y="728" text-anchor="middle">structured petition</text>

  <rect class="layer" x="70" y="825" width="1360" height="75" rx="8"/>
  <text class="label" x="105" y="869">Monitoring Layer</text>
  <rect class="box" x="380" y="837" width="250" height="42"/><text class="label" x="505" y="864" text-anchor="middle">LangSmith tracing</text>
  <rect class="box" x="700" y="837" width="250" height="42"/><text class="label" x="825" y="864" text-anchor="middle">API error logging</text>
  <rect class="box" x="1020" y="837" width="250" height="42"/><text class="label" x="1145" y="864" text-anchor="middle">Generation validation</text>

  <path class="arrow" d="M815 207 V315"/><path class="arrow" d="M885 377 V500"/><path class="arrow" d="M765 535 H820"/><path class="arrow" d="M1050 535 H1105"/>
  <path class="arrow" d="M1150 377 V680"/><path class="arrow" d="M620 377 C530 500,430 610,360 680"/><path class="dash" d="M650 570 C650 610,645 640,645 680"/>
</svg>
