<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc">
  <title id="title">Use Case Diagram of Agentic Courtroom Simulator</title>
  <desc id="desc">Use case diagram showing user interactions, external AI services, RAG knowledge base, storage, and internal courtroom simulation use cases.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .boundary { fill: #fbfdff; stroke: #2563eb; stroke-width: 2.5; }
      .actor-line { stroke: #111827; stroke-width: 2.6; fill: none; stroke-linecap: round; }
      .actor-text { font: 700 18px Arial, sans-serif; fill: #111827; }
      .usecase { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2.2; }
      .internal { fill: #f8fbff; stroke: #be185d; stroke-width: 2.1; }
      .uc-text { font: 600 15px Arial, sans-serif; fill: #111827; }
      .small { font: 600 13px Arial, sans-serif; fill: #374151; }
      .title-text { font: 700 25px Arial, sans-serif; fill: #111827; }
      .section-text { font: 700 16px Arial, sans-serif; fill: #1e3a8a; }
      .assoc { stroke: #111827; stroke-width: 2.1; fill: none; }
      .include { stroke: #6b7280; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowhead); }
      .external-box { fill: #eef6ff; stroke: #38aee2; stroke-width: 2.2; }
      .note { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.7; }
      .note-text { font: 600 13px Arial, sans-serif; fill: #92400e; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6b7280" />
    </marker>
  </defs>

  <rect class="bg" width="1500" height="1050" />

  <text class="title-text" x="750" y="45" text-anchor="middle">Use Case Diagram: Agentic Courtroom Simulator System (ACSS)</text>

  <!-- System boundary -->
  <rect class="boundary" x="255" y="85" width="990" height="875" rx="8" />
  <text class="section-text" x="750" y="118" text-anchor="middle">Agentic Courtroom Simulator System</text>

  <!-- Primary actor: User -->
  <circle class="actor-line" cx="110" cy="215" r="24" />
  <path class="actor-line" d="M110 239 V315" />
  <path class="actor-line" d="M65 270 H155" />
  <path class="actor-line" d="M110 315 L68 375" />
  <path class="actor-line" d="M110 315 L152 375" />
  <text class="actor-text" x="110" y="430" text-anchor="middle">User</text>

  <!-- External actors / services -->
  <rect class="external-box" x="1285" y="160" width="185" height="70" rx="5" />
  <text class="actor-text" x="1378" y="188" text-anchor="middle">RAG /</text>
  <text class="actor-text" x="1378" y="212" text-anchor="middle">Knowledge Base</text>

  <rect class="external-box" x="1285" y="430" width="185" height="70" rx="5" />
  <text class="actor-text" x="1378" y="458" text-anchor="middle">LLM / Agent</text>
  <text class="actor-text" x="1378" y="482" text-anchor="middle">Engine</text>

  <rect class="external-box" x="1285" y="735" width="185" height="70" rx="5" />
  <text class="actor-text" x="1378" y="765" text-anchor="middle">MongoDB</text>
  <text class="actor-text" x="1378" y="789" text-anchor="middle">Storage</text>

  <!-- User-facing use cases -->
  <ellipse class="usecase" cx="435" cy="175" rx="130" ry="34" />
  <text class="uc-text" x="435" y="181" text-anchor="middle">Open Simulator</text>

  <ellipse class="usecase" cx="435" cy="260" rx="145" ry="36" />
  <text class="uc-text" x="435" y="257" text-anchor="middle">Upload Plaintiff</text>
  <text class="uc-text" x="435" y="276" text-anchor="middle">Petition</text>

  <ellipse class="usecase" cx="435" cy="350" rx="150" ry="36" />
  <text class="uc-text" x="435" y="347" text-anchor="middle">Upload Defendant</text>
  <text class="uc-text" x="435" y="366" text-anchor="middle">Response</text>

  <ellipse class="usecase" cx="435" cy="455" rx="140" ry="36" />
  <text class="uc-text" x="435" y="452" text-anchor="middle">Start Trial</text>
  <text class="uc-text" x="435" y="471" text-anchor="middle">Simulation</text>

  <ellipse class="usecase" cx="435" cy="565" rx="135" ry="34" />
  <text class="uc-text" x="435" y="571" text-anchor="middle">View Trial Progress</text>

  <ellipse class="usecase" cx="435" cy="650" rx="135" ry="34" />
  <text class="uc-text" x="435" y="656" text-anchor="middle">View Citations</text>

  <ellipse class="usecase" cx="435" cy="735" rx="135" ry="34" />
  <text class="uc-text" x="435" y="741" text-anchor="middle">View Final Verdict</text>

  <ellipse class="usecase" cx="435" cy="820" rx="145" ry="34" />
  <text class="uc-text" x="435" y="826" text-anchor="middle">Download Transcript</text>

  <ellipse class="usecase" cx="435" cy="905" rx="135" ry="34" />
  <text class="uc-text" x="435" y="911" text-anchor="middle">Manage Trial History</text>

  <!-- Internal included use cases -->
  <ellipse class="internal" cx="800" cy="305" rx="145" ry="34" />
  <text class="uc-text" x="800" y="311" text-anchor="middle">Extract Document Text</text>

  <ellipse class="internal" cx="800" cy="405" rx="150" ry="34" />
  <text class="uc-text" x="800" y="411" text-anchor="middle">Retrieve Legal Context</text>

  <ellipse class="internal" cx="825" cy="520" rx="155" ry="36" />
  <text class="uc-text" x="825" y="517" text-anchor="middle">Generate Plaintiff</text>
  <text class="uc-text" x="825" y="536" text-anchor="middle">Argument</text>

  <ellipse class="internal" cx="825" cy="615" rx="160" ry="36" />
  <text class="uc-text" x="825" y="612" text-anchor="middle">Generate Defendant</text>
  <text class="uc-text" x="825" y="631" text-anchor="middle">Argument</text>

  <ellipse class="internal" cx="825" cy="710" rx="150" ry="34" />
  <text class="uc-text" x="825" y="716" text-anchor="middle">Evaluate Arguments</text>

  <ellipse class="internal" cx="825" cy="805" rx="135" ry="34" />
  <text class="uc-text" x="825" y="811" text-anchor="middle">Generate Verdict</text>

  <ellipse class="internal" cx="825" cy="900" rx="135" ry="34" />
  <text class="uc-text" x="825" y="906" text-anchor="middle">Save Trial Session</text>

  <!-- User associations -->
  <path class="assoc" d="M158 238 L305 178" />
  <path class="assoc" d="M158 258 L292 260" />
  <path class="assoc" d="M155 285 L292 350" />
  <path class="assoc" d="M150 315 L300 455" />
  <path class="assoc" d="M140 350 L307 565" />
  <path class="assoc" d="M128 373 L310 650" />
  <path class="assoc" d="M112 376 L308 735" />
  <path class="assoc" d="M96 373 L295 820" />
  <path class="assoc" d="M78 362 L300 905" />

  <!-- Include relationships from user-facing cases -->
  <path class="include" d="M560 270 C615 280, 645 288, 665 298" />
  <text class="small" x="600" y="264">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M570 345 C620 338, 645 326, 665 315" />
  <text class="small" x="600" y="338">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M570 455 C625 438, 650 425, 667 414" />
  <text class="small" x="595" y="434">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M575 465 C625 482, 647 498, 675 512" />
  <text class="small" x="595" y="498">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M575 472 C630 518, 650 574, 674 603" />
  <text class="small" x="592" y="560">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M565 482 C625 575, 660 655, 693 700" />
  <text class="small" x="598" y="660">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M545 488 C610 625, 680 745, 705 795" />
  <text class="small" x="600" y="745">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M543 735 C615 780, 670 830, 713 884" />
  <text class="small" x="585" y="825">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M568 820 C625 845, 675 870, 710 890" />
  <text class="small" x="600" y="858">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M565 905 H690" />
  <text class="small" x="600" y="895">&lt;&lt;include&gt;&gt;</text>

  <path class="include" d="M555 650 C620 590, 672 475, 693 423" />
  <text class="small" x="610" y="525">&lt;&lt;uses&gt;&gt;</text>

  <!-- External service associations -->
  <path class="assoc" d="M1285 195 C1175 225, 1050 310, 930 390" />
  <path class="assoc" d="M1285 465 C1170 475, 1050 500, 972 515" />
  <path class="assoc" d="M1285 465 C1165 530, 1060 585, 980 610" />
  <path class="assoc" d="M1285 465 C1160 610, 1060 690, 970 710" />
  <path class="assoc" d="M1285 465 C1155 685, 1060 780, 955 805" />
  <path class="assoc" d="M1285 770 C1160 785, 1050 845, 955 895" />
  <path class="assoc" d="M1285 770 C1135 825, 930 890, 570 905" />

  <!-- Notes -->
  <rect class="note" x="940" y="140" width="240" height="80" rx="6" />
  <text class="note-text" x="1060" y="166" text-anchor="middle">RAG provides legal context</text>
  <text class="note-text" x="1060" y="186" text-anchor="middle">for citations and grounded</text>
  <text class="note-text" x="1060" y="206" text-anchor="middle">courtroom reasoning.</text>

  <rect class="note" x="930" y="940" width="260" height="58" rx="6" />
  <text class="note-text" x="1060" y="964" text-anchor="middle">Trial history, verdict, citations,</text>
  <text class="note-text" x="1060" y="984" text-anchor="middle">and transcript are stored.</text>
</svg>
