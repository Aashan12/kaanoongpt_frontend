<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Class Diagram of Authentication and User Management System</title>
  <desc id="desc">Class diagram showing frontend auth context, auth pages, backend auth router, user models, password utility, email service, JWT service, and protected route guard.</desc>
  <defs><style>
    .bg{fill:#fff}.title{font:700 26px Arial,sans-serif;fill:#111827}.class{fill:#fff;stroke:#1d4ed8;stroke-width:2}.model{fill:#f8fbff;stroke:#2563eb;stroke-width:2}.service{fill:#fdf2f8;stroke:#be185d;stroke-width:2}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2}
    .head{font:700 16px Arial,sans-serif;fill:#111827}.txt{font:600 13px Arial,sans-serif;fill:#374151}.line{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#a)}
  </style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker></defs>
  <rect class="bg" width="1500" height="1000"/><text class="title" x="750" y="45" text-anchor="middle">Class Diagram: Authentication and User Management System (AUMS)</text>
  <g><rect class="class" x="65" y="95" width="250" height="170" rx="4"/><text class="head" x="190" y="122" text-anchor="middle">AuthContext</text><line x1="65" y1="135" x2="315" y2="135" stroke="#1d4ed8"/><text class="txt" x="82" y="160">- user</text><text class="txt" x="82" y="182">- loading</text><text class="txt" x="82" y="204">- access_token</text><line x1="65" y1="218" x2="315" y2="218" stroke="#1d4ed8"/><text class="txt" x="82" y="242">+ login()</text><text class="txt" x="160" y="242">+ logout()</text></g>
  <g><rect class="class" x="370" y="95" width="250" height="170" rx="4"/><text class="head" x="495" y="122" text-anchor="middle">AuthPages</text><line x1="370" y1="135" x2="620" y2="135" stroke="#1d4ed8"/><text class="txt" x="388" y="160">+ LoginPage</text><text class="txt" x="388" y="182">+ SignupPage</text><text class="txt" x="388" y="204">+ VerifyOtpPage</text><line x1="370" y1="218" x2="620" y2="218" stroke="#1d4ed8"/><text class="txt" x="388" y="242">+ submitForm()</text></g>
  <g><rect class="service" x="675" y="95" width="250" height="200" rx="4"/><text class="head" x="800" y="122" text-anchor="middle">AuthRouter</text><line x1="675" y1="135" x2="925" y2="135" stroke="#be185d"/><text class="txt" x="693" y="160">+ signup()</text><text class="txt" x="693" y="182">+ verify_otp()</text><text class="txt" x="693" y="204">+ resend_otp()</text><text class="txt" x="693" y="226">+ login()</text><text class="txt" x="693" y="248">+ get_current_user_info()</text></g>
  <g><rect class="service" x="980" y="95" width="250" height="200" rx="4"/><text class="head" x="1105" y="122" text-anchor="middle">ProtectedRouteGuard</text><line x1="980" y1="135" x2="1230" y2="135" stroke="#be185d"/><text class="txt" x="998" y="160">+ get_current_user()</text><text class="txt" x="998" y="182">+ decode_token()</text><text class="txt" x="998" y="204">+ check_active_user()</text><text class="txt" x="998" y="226">+ allow_or_reject()</text></g>
  <g><rect class="model" x="65" y="370" width="250" height="230" rx="4"/><text class="head" x="190" y="397" text-anchor="middle">User</text><line x1="65" y1="410" x2="315" y2="410" stroke="#2563eb"/><text class="txt" x="82" y="435">+ email</text><text class="txt" x="82" y="457">+ full_name</text><text class="txt" x="82" y="479">+ organization_type</text><text class="txt" x="82" y="501">+ hashed_password</text><text class="txt" x="82" y="523">+ is_email_verified</text><text class="txt" x="82" y="545">+ is_active</text><text class="txt" x="82" y="567">+ timestamps</text></g>
  <g><rect class="model" x="370" y="370" width="250" height="230" rx="4"/><text class="head" x="495" y="397" text-anchor="middle">PendingUser</text><line x1="370" y1="410" x2="620" y2="410" stroke="#2563eb"/><text class="txt" x="388" y="435">+ email</text><text class="txt" x="388" y="457">+ signup_profile_data</text><text class="txt" x="388" y="479">+ hashed_password</text><text class="txt" x="388" y="501">+ otp_code</text><text class="txt" x="388" y="523">+ otp_attempts</text><line x1="370" y1="540" x2="620" y2="540" stroke="#2563eb"/><text class="txt" x="388" y="565">+ is_otp_expired()</text><text class="txt" x="388" y="587">+ is_locked()</text></g>
  <g><rect class="service" x="675" y="370" width="250" height="190" rx="4"/><text class="head" x="800" y="397" text-anchor="middle">PasswordUtil</text><line x1="675" y1="410" x2="925" y2="410" stroke="#be185d"/><text class="txt" x="693" y="435">+ hash_password()</text><text class="txt" x="693" y="457">+ verify_password()</text><text class="txt" x="693" y="479">- sha256 prehash</text><text class="txt" x="693" y="501">- bcrypt rounds</text></g>
  <g><rect class="service" x="980" y="370" width="250" height="190" rx="4"/><text class="head" x="1105" y="397" text-anchor="middle">JwtService</text><line x1="980" y1="410" x2="1230" y2="410" stroke="#be185d"/><text class="txt" x="998" y="435">+ create_access_token()</text><text class="txt" x="998" y="457">+ decode_token()</text><text class="txt" x="998" y="479">+ validate_expiry()</text><text class="txt" x="998" y="501">- SECRET_KEY</text><text class="txt" x="998" y="523">- HS256</text></g>
  <g><rect class="service" x="65" y="690" width="250" height="160" rx="4"/><text class="head" x="190" y="717" text-anchor="middle">EmailService</text><line x1="65" y1="730" x2="315" y2="730" stroke="#be185d"/><text class="txt" x="82" y="755">+ generate_otp()</text><text class="txt" x="82" y="777">+ send_otp_email()</text></g>
  <g><rect class="db" x="370" y="690" width="250" height="160" rx="4"/><text class="head" x="495" y="717" text-anchor="middle">MongoDBCollections</text><line x1="370" y1="730" x2="620" y2="730" stroke="#059669"/><text class="txt" x="388" y="755">+ users</text><text class="txt" x="388" y="777">+ pending_users</text><text class="txt" x="388" y="799">+ kanoongpt_users</text></g>
  <g><rect class="db" x="675" y="690" width="250" height="160" rx="4"/><text class="head" x="800" y="717" text-anchor="middle">UserOwnedResources</text><line x1="675" y1="730" x2="925" y2="730" stroke="#059669"/><text class="txt" x="693" y="755">+ conversations</text><text class="txt" x="693" y="777">+ trial_sessions</text><text class="txt" x="693" y="799">+ petitions</text><text class="txt" x="693" y="821">+ token_wallet</text></g>
  <path class="line" d="M315 180 H370"/><path class="line" d="M620 180 H675"/><path class="line" d="M925 195 H980"/><path class="line" d="M800 295 V370"/><path class="line" d="M1105 295 V370"/><path class="line" d="M675 465 H620"/><path class="line" d="M370 485 H315"/><path class="line" d="M190 600 V690"/><path class="line" d="M495 600 V690"/><path class="line" d="M980 465 H925"/><path class="line" d="M1105 560 C1050 655,925 720,925 760"/>
</svg>
