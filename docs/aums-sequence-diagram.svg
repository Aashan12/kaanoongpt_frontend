<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">Sequence Diagram of Authentication and User Management System</title>
  <desc id="desc">Sequence diagram showing signup with OTP, login with bcrypt verification, JWT issuing, token storage, protected API access, and logout.</desc>
  <defs><style>
    .bg{fill:#fff}.title{font:700 26px Arial,sans-serif;fill:#111827}.head{fill:#f8fbff;stroke:#1d4ed8;stroke-width:2}.alt{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2}.sec{fill:#fdf2f8;stroke:#be185d;stroke-width:2}
    .txt{font:700 15px Arial,sans-serif;fill:#111827}.small{font:600 13px Arial,sans-serif;fill:#374151}.life{stroke:#111827;stroke-width:2;stroke-dasharray:7 7}.act{fill:#dbeafe;stroke:#2563eb}.actdb{fill:#d1fae5;stroke:#059669}.actsec{fill:#fce7f3;stroke:#be185d}
    .msg{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#a)}.ret{stroke:#6b7280;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#g)}.label{font:600 14px Arial,sans-serif;fill:#111827}.rlabel{font:600 13px Arial,sans-serif;fill:#4b5563}.frame{fill:none;stroke:#6b7280;stroke-width:1.8;stroke-dasharray:6 5}
  </style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker><marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#6b7280"/></marker></defs>
  <rect class="bg" width="1600" height="1050"/><text class="title" x="800" y="45" text-anchor="middle">Sequence Diagram: Authentication and User Management System (AUMS)</text>
  <rect class="head" x="45" y="80" width="125" height="52" rx="5"/><text class="txt" x="108" y="112" text-anchor="middle">User</text>
  <rect class="head" x="225" y="80" width="145" height="52" rx="5"/><text class="txt" x="298" y="103" text-anchor="middle">Frontend</text><text class="small" x="298" y="122" text-anchor="middle">Next.js</text>
  <rect class="alt" x="425" y="80" width="145" height="52" rx="5"/><text class="txt" x="498" y="103" text-anchor="middle">Auth API</text><text class="small" x="498" y="122" text-anchor="middle">FastAPI</text>
  <rect class="sec" x="625" y="80" width="145" height="52" rx="5"/><text class="txt" x="698" y="103" text-anchor="middle">Password</text><text class="small" x="698" y="122" text-anchor="middle">bcrypt utility</text>
  <rect class="db" x="825" y="80" width="145" height="52" rx="5"/><text class="txt" x="898" y="103" text-anchor="middle">MongoDB</text><text class="small" x="898" y="122" text-anchor="middle">users</text>
  <rect class="sec" x="1025" y="80" width="145" height="52" rx="5"/><text class="txt" x="1098" y="103" text-anchor="middle">Email Service</text><text class="small" x="1098" y="122" text-anchor="middle">OTP</text>
  <rect class="sec" x="1225" y="80" width="145" height="52" rx="5"/><text class="txt" x="1298" y="103" text-anchor="middle">JWT Service</text><text class="small" x="1298" y="122" text-anchor="middle">HS256</text>
  <rect class="alt" x="1425" y="80" width="130" height="52" rx="5"/><text class="txt" x="1490" y="103" text-anchor="middle">Protected</text><text class="small" x="1490" y="122" text-anchor="middle">API</text>
  <line class="life" x1="108" y1="132" x2="108" y2="980"/><line class="life" x1="298" y1="132" x2="298" y2="980"/><line class="life" x1="498" y1="132" x2="498" y2="980"/><line class="life" x1="698" y1="132" x2="698" y2="980"/><line class="life" x1="898" y1="132" x2="898" y2="980"/><line class="life" x1="1098" y1="132" x2="1098" y2="980"/><line class="life" x1="1298" y1="132" x2="1298" y2="980"/><line class="life" x1="1490" y1="132" x2="1490" y2="980"/>
  <rect class="act" x="290" y="170" width="16" height="735"/><rect class="act" x="490" y="235" width="16" height="610"/><rect class="actsec" x="690" y="265" width="16" height="55"/><rect class="actdb" x="890" y="330" width="16" height="170"/><rect class="actsec" x="1090" y="390" width="16" height="50"/><rect class="actsec" x="1290" y="620" width="16" height="80"/><rect class="act" x="1482" y="760" width="16" height="58"/>
  <rect class="frame" x="70" y="155" width="1080" height="375" rx="3"/><text class="small" x="112" y="176">alt: signup and OTP verification</text>
  <path class="msg" d="M108 205 H290"/><text class="label" x="199" y="196" text-anchor="middle">Submit signup form</text>
  <path class="msg" d="M306 245 H490"/><text class="label" x="398" y="236" text-anchor="middle">POST /auth/signup</text>
  <path class="msg" d="M506 280 H690"/><text class="label" x="598" y="271" text-anchor="middle">Hash password</text>
  <path class="ret" d="M690 320 H506"/><text class="rlabel" x="598" y="312" text-anchor="middle">hashed_password</text>
  <path class="msg" d="M506 350 H890"/><text class="label" x="698" y="341" text-anchor="middle">Create PendingUser with OTP</text>
  <path class="msg" d="M506 405 H1090"/><text class="label" x="798" y="396" text-anchor="middle">Send OTP email</text>
  <path class="ret" d="M1090 445 H506"/><text class="rlabel" x="798" y="437" text-anchor="middle">OTP sent</text>
  <path class="ret" d="M490 480 H306"/><text class="rlabel" x="398" y="472" text-anchor="middle">Ask user to verify OTP</text>
  <path class="msg" d="M108 520 H290"/><text class="label" x="199" y="511" text-anchor="middle">Submit OTP</text>
  <path class="msg" d="M306 555 H490"/><text class="label" x="398" y="546" text-anchor="middle">POST /auth/verify-otp</text>
  <path class="msg" d="M506 590 H890"/><text class="label" x="698" y="581" text-anchor="middle">Validate pending user and create User</text>
  <path class="msg" d="M506 625 H1290"/><text class="label" x="898" y="616" text-anchor="middle">Create JWT token</text>
  <path class="ret" d="M1290 700 H506"/><text class="rlabel" x="898" y="692" text-anchor="middle">access_token</text>
  <rect class="frame" x="70" y="535" width="820" height="185" rx="3"/><text class="small" x="112" y="556">alt: login</text>
  <path class="msg" d="M108 742 H290"/><text class="label" x="199" y="733" text-anchor="middle">Submit email and password</text>
  <path class="msg" d="M306 775 H490"/><text class="label" x="398" y="766" text-anchor="middle">POST /auth/login</text>
  <path class="msg" d="M506 805 H890"/><text class="label" x="698" y="796" text-anchor="middle">Find active verified user</text>
  <path class="msg" d="M506 835 H690"/><text class="label" x="598" y="826" text-anchor="middle">Verify password</text>
  <path class="msg" d="M506 865 H1290"/><text class="label" x="898" y="856" text-anchor="middle">Issue JWT token</text>
  <path class="ret" d="M490 895 H306"/><text class="rlabel" x="398" y="887" text-anchor="middle">Token and user info</text>
  <path class="msg" d="M306 925 H1482"/><text class="label" x="894" y="916" text-anchor="middle">Request protected resource with Authorization: Bearer token</text>
  <path class="msg" d="M1482 955 H1290"/><text class="label" x="1386" y="946" text-anchor="middle">Validate JWT</text>
  <path class="ret" d="M1482 980 H306"/><text class="rlabel" x="894" y="972" text-anchor="middle">Protected response / user data</text>
</svg>
