<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000" role="img" aria-labelledby="title desc">
  <title id="title">Class Diagram of Petition and Legal Document Generation System</title>
  <desc id="desc">Class diagram showing frontend petition components, backend request and document models, conversation session, and related services.</desc>
  <defs><style>
    .bg{fill:#fff}.title{font:700 26px Arial,sans-serif;fill:#111827}.class{fill:#fff;stroke:#1d4ed8;stroke-width:2}.model{fill:#f8fbff;stroke:#2563eb;stroke-width:2}.service{fill:#fdf2f8;stroke:#be185d;stroke-width:2}.db{fill:#ecfdf5;stroke:#059669;stroke-width:2}
    .head{font:700 16px Arial,sans-serif;fill:#111827}.txt{font:600 13px Arial,sans-serif;fill:#374151}.line{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#a)}.assoc{stroke:#6b7280;stroke-width:2;fill:none}
  </style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker></defs>
  <rect class="bg" width="1500" height="1000"/><text class="title" x="750" y="45" text-anchor="middle">Class Diagram: Petition and Legal Document Generation System</text>
  <g><rect class="class" x="60" y="95" width="255" height="170" rx="4"/><text class="head" x="188" y="122" text-anchor="middle">PetitionMaker</text><line x1="60" y1="135" x2="315" y2="135" stroke="#1d4ed8"/><text class="txt" x="78" y="160">- currentStep</text><text class="txt" x="78" y="182">- selectedCaseType</text><text class="txt" x="78" y="204">- formData</text><line x1="60" y1="218" x2="315" y2="218" stroke="#1d4ed8"/><text class="txt" x="78" y="242">+ handleNext()</text></g>
  <g><rect class="class" x="370" y="95" width="255" height="170" rx="4"/><text class="head" x="498" y="122" text-anchor="middle">FormSections</text><line x1="370" y1="135" x2="625" y2="135" stroke="#1d4ed8"/><text class="txt" x="388" y="160">+ CourtInfo</text><text class="txt" x="388" y="182">+ PlaintiffInfo</text><text class="txt" x="388" y="204">+ DefendantInfo</text><text class="txt" x="388" y="226">+ CaseDetails</text><text class="txt" x="388" y="248">+ WitnessSection</text></g>
  <g><rect class="class" x="680" y="95" width="255" height="170" rx="4"/><text class="head" x="808" y="122" text-anchor="middle">PetitionPreview</text><line x1="680" y1="135" x2="935" y2="135" stroke="#1d4ed8"/><text class="txt" x="698" y="160">- formData</text><text class="txt" x="698" y="182">- selectedCaseType</text><line x1="680" y1="205" x2="935" y2="205" stroke="#1d4ed8"/><text class="txt" x="698" y="230">+ renderStructuredDraft()</text><text class="txt" x="698" y="252">+ updatePreview()</text></g>
  <g><rect class="service" x="995" y="95" width="255" height="170" rx="4"/><text class="head" x="1123" y="122" text-anchor="middle">PetitionAPI</text><line x1="995" y1="135" x2="1250" y2="135" stroke="#be185d"/><text class="txt" x="1013" y="160">+ startConversation()</text><text class="txt" x="1013" y="182">+ sendMessage()</text><text class="txt" x="1013" y="204">+ acceptContent()</text><text class="txt" x="1013" y="226">+ regenerateContent()</text><text class="txt" x="1013" y="248">+ generatePDF()</text></g>
  <g><rect class="model" x="60" y="350" width="255" height="210" rx="4"/><text class="head" x="188" y="377" text-anchor="middle">PetitionData</text><line x1="60" y1="390" x2="315" y2="390" stroke="#2563eb"/><text class="txt" x="78" y="415">+ courtInfo: CourtInfoData</text><text class="txt" x="78" y="437">+ plaintiff: PartyInfo</text><text class="txt" x="78" y="459">+ defendant: PartyInfo</text><text class="txt" x="78" y="481">+ caseDetails: CaseDetailsData</text><text class="txt" x="78" y="503">+ witnesses: WitnessData[]</text><text class="txt" x="78" y="525">+ evidence: string[]</text></g>
  <g><rect class="model" x="370" y="350" width="255" height="210" rx="4"/><text class="head" x="498" y="377" text-anchor="middle">PetitionDocument</text><line x1="370" y1="390" x2="625" y2="390" stroke="#2563eb"/><text class="txt" x="388" y="415">+ id</text><text class="txt" x="388" y="437">+ user_id</text><text class="txt" x="388" y="459">+ case_type</text><text class="txt" x="388" y="481">+ petition_data</text><text class="txt" x="388" y="503">+ pdf_url</text><text class="txt" x="388" y="525">+ status, timestamps</text></g>
  <g><rect class="service" x="680" y="350" width="255" height="210" rx="4"/><text class="head" x="808" y="377" text-anchor="middle">ConversationSession</text><line x1="680" y1="390" x2="935" y2="390" stroke="#be185d"/><text class="txt" x="698" y="415">- messages</text><text class="txt" x="698" y="437">- extracted_info</text><text class="txt" x="698" y="459">- petition_document</text><text class="txt" x="698" y="481">- current_section</text><line x1="680" y1="497" x2="935" y2="497" stroke="#be185d"/><text class="txt" x="698" y="521">+ add_message()</text><text class="txt" x="698" y="543">+ update_petition()</text></g>
  <g><rect class="service" x="995" y="350" width="255" height="210" rx="4"/><text class="head" x="1123" y="377" text-anchor="middle">GenerationService</text><line x1="995" y1="390" x2="1250" y2="390" stroke="#be185d"/><text class="txt" x="1013" y="415">+ generateEvidenceQuestion()</text><text class="txt" x="1013" y="437">+ queryCivilLawRAG()</text><text class="txt" x="1013" y="459">+ generateNepaliContent()</text><text class="txt" x="1013" y="481">+ formatGrounds()</text><text class="txt" x="1013" y="503">+ formatEvidence()</text></g>
  <g><rect class="model" x="60" y="645" width="255" height="180" rx="4"/><text class="head" x="188" y="672" text-anchor="middle">PartyInfo</text><line x1="60" y1="685" x2="315" y2="685" stroke="#2563eb"/><text class="txt" x="78" y="710">+ name</text><text class="txt" x="78" y="732">+ fatherName</text><text class="txt" x="78" y="754">+ grandfatherName</text><text class="txt" x="78" y="776">+ age, gender, phone</text><text class="txt" x="78" y="798">+ addressData</text></g>
  <g><rect class="model" x="370" y="645" width="255" height="180" rx="4"/><text class="head" x="498" y="672" text-anchor="middle">CaseDetailsData</text><line x1="370" y1="685" x2="625" y2="685" stroke="#2563eb"/><text class="txt" x="388" y="710">+ formatted_grounds</text><text class="txt" x="388" y="732">+ legal_basis</text><text class="txt" x="388" y="754">+ evidence[]</text></g>
  <g><rect class="db" x="680" y="645" width="255" height="180" rx="4"/><text class="head" x="808" y="672" text-anchor="middle">StorageService</text><line x1="680" y1="685" x2="935" y2="685" stroke="#059669"/><text class="txt" x="698" y="710">+ savePetition()</text><text class="txt" x="698" y="732">+ listPetitions()</text><text class="txt" x="698" y="754">+ getPetition()</text><text class="txt" x="698" y="776">+ deletePetition()</text></g>
  <g><rect class="db" x="995" y="645" width="255" height="180" rx="4"/><text class="head" x="1123" y="672" text-anchor="middle">CloudinaryService</text><line x1="995" y1="685" x2="1250" y2="685" stroke="#059669"/><text class="txt" x="1013" y="710">+ upload_pdf_to_cloudinary()</text><text class="txt" x="1013" y="732">+ delete_pdf_from_cloudinary()</text></g>
  <path class="line" d="M315 180 H370"/><path class="line" d="M625 180 H680"/><path class="line" d="M935 180 H995"/><path class="line" d="M188 265 V350"/><path class="line" d="M498 265 V350"/><path class="line" d="M1123 265 V350"/><path class="line" d="M625 455 H680"/><path class="line" d="M935 455 H995"/><path class="line" d="M188 560 V645"/><path class="line" d="M498 560 V645"/><path class="line" d="M808 560 V645"/><path class="line" d="M935 735 H995"/>
</svg>
