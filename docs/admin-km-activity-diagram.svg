<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450" role="img" aria-labelledby="title desc">
  <title id="title">Activity Diagram of Admin and Knowledge Management System</title>
  <desc id="desc">Activity diagram showing admin authentication, legal document upload or catalog ingestion, metadata storage, text extraction, chunking, vector indexing, monitoring, and maintenance.</desc>
  <defs><style>
    .bg{fill:#fff}.node{fill:#fff;stroke:#1f2937;stroke-width:2.2}.decision{fill:#fff;stroke:#1f2937;stroke-width:2.2}.start{fill:#111827;stroke:#111827}
    .label{font:600 18px Arial,sans-serif;fill:#111827}.small{font:600 14px Arial,sans-serif;fill:#374151}.arrow{stroke:#111827;stroke-width:2.4;fill:none;marker-end:url(#a)}
    .note{fill:#eef6ff;stroke:#38aee2;stroke-width:1.8}.note-text{font:600 13px Arial,sans-serif;fill:#1e3a8a}
  </style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2,2 L10,6 L2,10 Z" fill="#111827"/></marker></defs>
  <rect class="bg" width="1200" height="1450"/>
  <circle class="start" cx="600" cy="45" r="18"/><path class="arrow" d="M600 63 V95"/>
  <rect class="node" x="410" y="95" width="380" height="58" rx="4"/><text class="label" x="600" y="131" text-anchor="middle">Admin Login</text><path class="arrow" d="M600 153 V195"/>
  <rect class="node" x="375" y="195" width="450" height="58" rx="4"/><text class="label" x="600" y="231" text-anchor="middle">Validate Admin JWT / Access Control</text><path class="arrow" d="M600 253 V295"/>
  <rect class="node" x="390" y="295" width="420" height="58" rx="4"/><text class="label" x="600" y="331" text-anchor="middle">Open Knowledge Base Dashboard</text><path class="arrow" d="M600 353 V395"/>
  <path class="decision" d="M600 395 L745 480 L600 565 L455 480 Z"/><text class="label" x="600" y="474" text-anchor="middle">Admin</text><text class="label" x="600" y="499" text-anchor="middle">Action?</text>
  <path class="arrow" d="M455 480 H170 V620"/><text class="small" x="280" y="462">Upload file</text>
  <path class="arrow" d="M745 480 H1030 V620"/><text class="small" x="880" y="462">Catalog ingest</text>
  <path class="arrow" d="M600 565 V620"/><text class="small" x="615" y="594">Monitor</text>

  <rect class="node" x="50" y="620" width="240" height="70" rx="4"/><text class="label" x="170" y="649" text-anchor="middle">Upload Law or</text><text class="label" x="170" y="674" text-anchor="middle">Case PDF</text><path class="arrow" d="M170 690 V735"/>
  <rect class="node" x="50" y="735" width="240" height="70" rx="4"/><text class="label" x="170" y="764" text-anchor="middle">Store Source File</text><text class="label" x="170" y="789" text-anchor="middle">in Cloudinary</text><path class="arrow" d="M170 805 V850"/>
  <rect class="node" x="50" y="850" width="240" height="70" rx="4"/><text class="label" x="170" y="879" text-anchor="middle">Create Law / Case</text><text class="label" x="170" y="904" text-anchor="middle">Metadata Record</text><path class="arrow" d="M290 885 H430"/>

  <rect class="node" x="910" y="620" width="240" height="70" rx="4"/><text class="label" x="1030" y="649" text-anchor="middle">Select Catalog</text><text class="label" x="1030" y="674" text-anchor="middle">Document</text><path class="arrow" d="M1030 690 V735"/>
  <rect class="node" x="910" y="735" width="240" height="70" rx="4"/><text class="label" x="1030" y="764" text-anchor="middle">Fetch Full Text</text><text class="label" x="1030" y="789" text-anchor="middle">from Source</text><path class="arrow" d="M1030 805 V850"/>
  <rect class="node" x="910" y="850" width="240" height="70" rx="4"/><text class="label" x="1030" y="879" text-anchor="middle">Create Section</text><text class="label" x="1030" y="904" text-anchor="middle">Records</text><path class="arrow" d="M910 885 H770"/>

  <rect class="node" x="430" y="835" width="340" height="70" rx="4"/><text class="label" x="600" y="864" text-anchor="middle">Extract Text with</text><text class="label" x="600" y="889" text-anchor="middle">Page Metadata</text><path class="arrow" d="M600 905 V950"/>
  <rect class="node" x="430" y="950" width="340" height="70" rx="4"/><text class="label" x="600" y="979" text-anchor="middle">Chunk Document</text><text class="label" x="600" y="1004" text-anchor="middle">and Build Metadata</text><path class="arrow" d="M600 1020 V1065"/>
  <rect class="node" x="410" y="1065" width="380" height="70" rx="4"/><text class="label" x="600" y="1094" text-anchor="middle">Generate Embeddings and</text><text class="label" x="600" y="1119" text-anchor="middle">Index Vector Chunks</text><path class="arrow" d="M600 1135 V1180"/>
  <rect class="node" x="405" y="1180" width="390" height="70" rx="4"/><text class="label" x="600" y="1209" text-anchor="middle">Update Embedding Status,</text><text class="label" x="600" y="1234" text-anchor="middle">Chunk Count and Logs</text><path class="arrow" d="M600 1250 V1295"/>
  <rect class="node" x="400" y="1295" width="400" height="58" rx="4"/><text class="label" x="600" y="1331" text-anchor="middle">Display KB Statistics and Status</text><path class="arrow" d="M600 1353 V1395"/>
  <circle class="start" cx="600" cy="1415" r="18"/>

  <rect class="note" x="70" y="1110" width="290" height="80" rx="6"/><text class="note-text" x="215" y="1136" text-anchor="middle">Vector collections are partitioned</text><text class="note-text" x="215" y="1156" text-anchor="middle">by country and source type:</text><text class="note-text" x="215" y="1176" text-anchor="middle">laws / cases.</text>
</svg>
