<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="950" viewBox="0 0 1450 950" role="img" aria-labelledby="title desc">
  <title id="title">ERD of Petition and Legal Document Generation System</title>
  <desc id="desc">Entity relationship diagram showing users, petitions, petition data, parties, witnesses, evidence, PDF file metadata, and conversation sessions.</desc>
  <defs><style>
    .bg{fill:#fff}.title{font:700 26px Arial,sans-serif;fill:#111827}.ent{fill:#fff;stroke:#1d4ed8;stroke-width:2}.emb{fill:#f8fbff;stroke:#2563eb;stroke-width:2}.file{fill:#ecfdf5;stroke:#059669;stroke-width:2}.conv{fill:#fdf2f8;stroke:#be185d;stroke-width:2}
    .h{font:700 16px Arial,sans-serif;fill:#111827}.t{font:600 13px Arial,sans-serif;fill:#374151}.rel{stroke:#111827;stroke-width:2;fill:none}.card{font:700 14px Arial,sans-serif;fill:#111827}
  </style></defs>
  <rect class="bg" width="1450" height="950"/><text class="title" x="725" y="45" text-anchor="middle">Entity Relationship Diagram: Petition and Legal Document Generation System</text>
  <g><rect class="ent" x="80" y="110" width="250" height="170" rx="4"/><text class="h" x="205" y="137" text-anchor="middle">User</text><line x1="80" y1="150" x2="330" y2="150" stroke="#1d4ed8"/><text class="t" x="98" y="174">PK user_id</text><text class="t" x="98" y="196">name</text><text class="t" x="98" y="218">email</text><text class="t" x="98" y="240">role</text><text class="t" x="98" y="262">created_at</text></g>
  <g><rect class="ent" x="500" y="105" width="285" height="220" rx="4"/><text class="h" x="642" y="132" text-anchor="middle">Petition</text><line x1="500" y1="145" x2="785" y2="145" stroke="#1d4ed8"/><text class="t" x="518" y="169">PK petition_id</text><text class="t" x="518" y="191">FK user_id</text><text class="t" x="518" y="213">case_type</text><text class="t" x="518" y="235">case_type_nepali</text><text class="t" x="518" y="257">status</text><text class="t" x="518" y="279">created_at</text><text class="t" x="518" y="301">updated_at</text></g>
  <g><rect class="file" x="1010" y="115" width="285" height="185" rx="4"/><text class="h" x="1152" y="142" text-anchor="middle">PDF File</text><line x1="1010" y1="155" x2="1295" y2="155" stroke="#059669"/><text class="t" x="1028" y="179">PK file_id / public_id</text><text class="t" x="1028" y="201">FK petition_id</text><text class="t" x="1028" y="223">pdf_url</text><text class="t" x="1028" y="245">cloudinary_public_id</text><text class="t" x="1028" y="267">uploaded_at</text></g>
  <g><rect class="emb" x="75" y="420" width="285" height="185" rx="4"/><text class="h" x="218" y="447" text-anchor="middle">Court Info</text><line x1="75" y1="460" x2="360" y2="460" stroke="#2563eb"/><text class="t" x="93" y="484">PK court_info_id</text><text class="t" x="93" y="506">FK petition_id</text><text class="t" x="93" y="528">district</text><text class="t" x="93" y="550">districtNepali</text></g>
  <g><rect class="emb" x="420" y="420" width="285" height="220" rx="4"/><text class="h" x="563" y="447" text-anchor="middle">Party</text><line x1="420" y1="460" x2="705" y2="460" stroke="#2563eb"/><text class="t" x="438" y="484">PK party_id</text><text class="t" x="438" y="506">FK petition_id</text><text class="t" x="438" y="528">party_type: plaintiff/defendant</text><text class="t" x="438" y="550">name, fatherName</text><text class="t" x="438" y="572">age, gender, phone</text><text class="t" x="438" y="594">addressData</text></g>
  <g><rect class="emb" x="765" y="420" width="285" height="220" rx="4"/><text class="h" x="908" y="447" text-anchor="middle">Case Details</text><line x1="765" y1="460" x2="1050" y2="460" stroke="#2563eb"/><text class="t" x="783" y="484">PK case_details_id</text><text class="t" x="783" y="506">FK petition_id</text><text class="t" x="783" y="528">formatted_grounds</text><text class="t" x="783" y="550">legal_basis</text><text class="t" x="783" y="572">generated_sections</text><text class="t" x="783" y="594">citations</text></g>
  <g><rect class="emb" x="1110" y="420" width="285" height="220" rx="4"/><text class="h" x="1253" y="447" text-anchor="middle">Evidence / Witness</text><line x1="1110" y1="460" x2="1395" y2="460" stroke="#2563eb"/><text class="t" x="1128" y="484">PK item_id</text><text class="t" x="1128" y="506">FK petition_id</text><text class="t" x="1128" y="528">item_type: evidence/witness</text><text class="t" x="1128" y="550">name / description</text><text class="t" x="1128" y="572">address, phone</text></g>
  <g><rect class="conv" x="355" y="735" width="320" height="165" rx="4"/><text class="h" x="515" y="762" text-anchor="middle">Conversation Session</text><line x1="355" y1="775" x2="675" y2="775" stroke="#be185d"/><text class="t" x="373" y="799">PK session_id</text><text class="t" x="373" y="821">FK user_id</text><text class="t" x="373" y="843">case_type</text><text class="t" x="373" y="865">current_section</text><text class="t" x="373" y="887">started_at, last_updated</text></g>
  <g><rect class="conv" x="835" y="735" width="320" height="165" rx="4"/><text class="h" x="995" y="762" text-anchor="middle">Conversation Message</text><line x1="835" y1="775" x2="1155" y2="775" stroke="#be185d"/><text class="t" x="853" y="799">PK message_id</text><text class="t" x="853" y="821">FK session_id</text><text class="t" x="853" y="843">role</text><text class="t" x="853" y="865">content</text><text class="t" x="853" y="887">metadata, timestamp</text></g>
  <path class="rel" d="M330 195 H500"/><text class="card" x="385" y="185">1</text><text class="card" x="468" y="185">N</text>
  <path class="rel" d="M785 205 H1010"/><text class="card" x="815" y="195">1</text><text class="card" x="975" y="195">0..1</text>
  <path class="rel" d="M600 325 V420 H218"/><text class="card" x="610" y="352">1</text><text class="card" x="235" y="410">1</text>
  <path class="rel" d="M642 325 V390 H563 V420"/><text class="card" x="650" y="365">1</text><text class="card" x="575" y="410">2</text>
  <path class="rel" d="M685 325 V390 H908 V420"/><text class="card" x="695" y="365">1</text><text class="card" x="920" y="410">1</text>
  <path class="rel" d="M725 325 V390 H1253 V420"/><text class="card" x="735" y="365">1</text><text class="card" x="1260" y="410">N</text>
  <path class="rel" d="M205 280 V817 H355"/><text class="card" x="215" y="320">1</text><text class="card" x="322" y="807">N</text>
  <path class="rel" d="M675 817 H835"/><text class="card" x="690" y="807">1</text><text class="card" x="805" y="807">N</text>
</svg>
